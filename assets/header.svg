<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Hi, I'm Azhar Ali. WordPress developer in Multan, Pakistan.">
  <title>Hi, I'm Azhar Ali — WordPress developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081A2F"/>
      <stop offset="55%" stop-color="#02488C"/>
      <stop offset="100%" stop-color="#158ACB"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#158ACB"/>
      <stop offset="50%" stop-color="#C9922B"/>
      <stop offset="100%" stop-color="#158ACB"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1000" height="250" rx="5"/></clipPath>
    <clipPath id="cardclip"><rect x="40" y="26" width="920" height="198" rx="5"/></clipPath>

    <!-- Icons drawn as paths, so they render identically everywhere and do not
         depend on an emoji font being installed. 14 x 14 each. -->
    <g id="ic-commit" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle cx="7" cy="7" r="3.2"/>
      <path d="M0.5 7 H3.8"/>
      <path d="M10.2 7 H13.5"/>
    </g>
    <g id="ic-package" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 0.9 L13.1 4.2 V9.8 L7 13.1 L0.9 9.8 V4.2 Z"/>
      <path d="M0.9 4.2 L7 7.5 L13.1 4.2"/>
      <path d="M7 7.5 V13.1"/>
    </g>
    <g id="ic-clock" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="7" r="6.1"/>
      <path d="M7 3.4 V7.2 L9.8 8.8"/>
    </g>
    <g id="ic-case" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0.9" y="4.3" width="12.2" height="8.8" rx="1.4"/>
      <path d="M4.9 4.3 V2.7 A0.9 0.9 0 0 1 5.8 1.8 H8.2 A0.9 0.9 0 0 1 9.1 2.7 V4.3"/>
      <path d="M0.9 8 H13.1"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">

    <rect width="1000" height="250" fill="url(#bg)"/>

    <!-- Light drifting behind the glass. Four different durations so the loop
         never resyncs and never reads as a repeating GIF. -->
    <g filter="url(#soft)" opacity="0.8">
      <circle cx="170" cy="60" r="115" fill="#158ACB">
        <animate attributeName="cy" values="60;130;60" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="200" r="135" fill="#C9922B" opacity="0.42">
        <animate attributeName="cx" values="840;700;840" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="20" r="95" fill="#0E71B4">
        <animate attributeName="r" values="95;135;95" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="40" y="26" width="920" height="198" rx="5" fill="url(#glass)"/>
    <rect x="40" y="26" width="920" height="198" rx="5" fill="none" stroke="url(#rim)" stroke-width="1.4"/>

    <g clip-path="url(#cardclip)">
      <rect x="-320" y="26" width="300" height="198" fill="url(#sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="-320;1120" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.15s" fill="freeze"/>

      <text x="500" y="90" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.4">Hi &#128075;, I'm Azhar Ali</text>
      <text x="500" y="120" font-size="13.5" font-weight="600" fill="#9EC7E8" letter-spacing="3.2">WORDPRESS DEVELOPER &#183; MULTAN, PAKISTAN &#183; UTC+5</text>
      <text x="500" y="147" font-size="15" font-weight="400" fill="#DCEBF8">Plugins, block themes and WooCommerce. Patch testing for WordPress core.</text>
    </g>

    <!-- Stat pills, centred as a group: 87px left margin, 86px right. -->
    <g opacity="0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.45s" fill="freeze"/>

      <rect x="87" y="170" width="150" height="30" rx="5" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.26"/>
      <use href="#ic-commit" x="101" y="178" stroke="#BBD9F2"/>
      <text x="121" y="189" fill="#ffffff" text-anchor="start">6 core credits</text>

      <rect x="251" y="170" width="250" height="30" rx="5" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.26"/>
      <use href="#ic-package" x="265" y="178" stroke="#BBD9F2"/>
      <text x="285" y="189" fill="#ffffff" text-anchor="start">3 plugins &#183; 1 theme &#183; 2 patterns</text>

      <rect x="515" y="170" width="195" height="30" rx="5" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.26"/>
      <use href="#ic-clock" x="529" y="178" stroke="#BBD9F2"/>
      <text x="549" y="189" fill="#ffffff" text-anchor="start">7 years &#183; 150+ projects</text>

      <rect x="724" y="170" width="190" height="30" rx="5" fill="#C9922B" fill-opacity="0.22" stroke="#C9922B" stroke-opacity="0.7"/>
      <use href="#ic-case" x="738" y="178" stroke="#FFE6B4"/>
      <text x="758" y="189" fill="#FFE6B4" text-anchor="start">Open to remote roles</text>
    </g>

    <rect x="0" y="246" width="1000" height="4" fill="url(#accent)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
